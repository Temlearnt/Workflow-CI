name: CI - MLflow Project Training

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  train-model:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install MLflow
        run: |
          pip install mlflow pandas numpy scikit-learn

      - name: Run MLflow Project
        run: |
          cd MLProject
          mlflow run --env-manager=local . -P n_estimators=200 -P max_depth=10 -P min_samples_split=2